services:
  - type: web
    name: zed-store-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ZED_APP_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
