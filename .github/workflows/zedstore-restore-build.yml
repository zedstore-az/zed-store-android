name: ZED STORE restore build check
on:
  push:
    branches:
      - restore/zed-store-ui-integration-2026-11-06
    paths:
      - 'zedstore-management/**'
      - '.github/workflows/zedstore-restore-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zedstore-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zedstore-management/package-lock.json
      - run: npm ci
      - run: npm run build
