name: Build Birmarket Helper
on:
  push:
    branches:
      - birmarket-notification-helper
    paths:
      - 'android-birmarket-helper/**'
      - '.github/workflows/build-birmarket-helper.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build helper APK
        run: gradle assembleDebug
        working-directory: android-birmarket-helper
      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb wait-for-device
            sleep 15
            adb install -r android-birmarket-helper/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p az.zedstore.birmarket 1
            adb shell pm path az.zedstore.birmarket
      - uses: actions/upload-artifact@v4
        with:
          name: zed-store-birmarket-helper
          path: android-birmarket-helper/app/build/outputs/apk/debug/app-debug.apk
