name: ZED STORE Management build
on:
  pull_request:
    branches: [main]
    paths:
      - "zedstore-management/**"
      - ".github/workflows/zedstore-management-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zedstore-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zedstore-management/package.json
      - run: npm install
      - run: npm run build
