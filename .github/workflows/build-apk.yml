name: Build ZED STORE APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      - name: Install SDK packages
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          unzip -q ZED_STORE_Android_Studio_Project.zip -d project
          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"
          echo "=== ANDROID SOURCE CONTENT FOR WEBVIEW FIX ==="
          while IFS= read -r SRC; do
            echo "--- SOURCE: $SRC ---"
            sed -n '1,260p' "$SRC"
          done < <(find "$PROJECT_DIR" -type f \( -name '*.java' -o -name '*.kt' -o -name 'AndroidManifest.xml' \) -print)
          echo "=== SOURCE FILE MAP ==="
          find "$PROJECT_DIR" -type f \( -name 'index.html' -o -name '*.java' -o -name '*.kt' -o -name 'AndroidManifest.xml' -o -name '*.gradle' -o -name '*.gradle.kts' \) -print
          echo "=== WEB ASSET FILES ==="
          find "$PROJECT_DIR" -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print

      - name: Route Birmarket seller portal to external browser
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])
          path = next(iter(root.rglob("MainActivity.java")), None)
          if path is None:
              raise SystemExit("MainActivity.java not found")
          source = path.read_text(encoding="utf-8")
          if "External seller portal navigation" not in source:
              source = source.replace(
                  "import android.app.Activity;\\n",
                  "import android.app.Activity;\\nimport android.content.Intent;\\nimport android.net.Uri;\\n",
                  1
              )
              needle = "        webView.setWebViewClient(new WebViewClient() {\\n"
              lines = [
                  "            // External seller portal navigation",
                  "            @Override",
                  "            public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request) {",
                  "                Uri uri = request.getUrl();",
                  "                String host = uri.getHost();",
                  "                if (host != null && (host.equalsIgnoreCase(\\"business.umico.az\\") || host.equalsIgnoreCase(\\"business.birmarket.az\\"))) {",
                  "                    try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch (Exception ignored) {}",
                  "                    return true;",
                  "                }",
                  "                return false;",
                  "            }",
                  "",
                  "            @Override",
                  "            public boolean shouldOverrideUrlLoading(WebView view, String url) {",
                  "                Uri uri = Uri.parse(url);",
                  "                String host = uri.getHost();",
                  "                if (host != null && (host.equalsIgnoreCase(\\"business.umico.az\\") || host.equalsIgnoreCase(\\"business.birmarket.az\\"))) {",
                  "                    try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch (Exception ignored) {}",
                  "                    return true;",
                  "                }",
                  "                return false;",
                  "            }",
                  ""
              ]
              addition = "\\n".join(lines) + "\\n"
              if needle not in source:
                  raise SystemExit("WebViewClient insertion point not found")
              source = source.replace(needle, needle + addition, 1)
              path.write_text(source, encoding="utf-8")
              print(f"Patched {path}")
          else:
              print("External portal navigation already patched")
          PY

      - name: Add Ambar products screen
        run: python3 tools/inject-products-screen.py

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZED-STORE-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
