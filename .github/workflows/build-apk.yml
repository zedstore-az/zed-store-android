name: Build ZED STORE APK
on:
  push:
    branches: [zedstore-management, feature/real-push-notifications]
    paths:
      - 'android-app/**'
      - 'tools/generate-app-icons.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
      - name: Install SDK packages
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate ZED STORE launcher icons
        run: |
          python3 -m pip install --user pillow numpy
          python3 tools/generate-app-icons.py
      - name: Build standalone ZED STORE Management APK
        run: gradle -p android-app assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZED-STORE-Management-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
